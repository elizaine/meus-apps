<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cursos & Certificações - Liza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #090d16; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900/95 border-b border-slate-800 sticky top-0 z-30 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <a href="../" class="text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 border border-slate-700 px-3 py-2 rounded-xl transition">
          ← Hub
        </a>
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-slate-950 font-bold text-lg">
          🎓
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-white text-lg tracking-tight">Cursos & Certificações • Liza</h1>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
              ☁️ Google Sheets
            </span>
          </div>
          <p class="text-xs text-slate-400">Trilhas de estudo, acessos, progresso e certificados</p>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2.5">
        <button onclick="openCourseModal()" class="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 transition cursor-pointer">
          <span>➕</span> Novo Curso / Certificação
        </button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 space-y-5">

    <!-- Resumo -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <p class="text-[11px] text-slate-400 font-medium">Total</p>
        <p id="statTotal" class="text-2xl font-extrabold text-white mt-0.5">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <p class="text-[11px] text-amber-400 font-medium">Pendentes</p>
        <p id="statPending" class="text-2xl font-extrabold text-amber-300 mt-0.5">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <p class="text-[11px] text-sky-400 font-medium">Em andamento</p>
        <p id="statProgress" class="text-2xl font-extrabold text-sky-300 mt-0.5">0</p>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <p class="text-[11px] text-emerald-400 font-medium">Concluídos</p>
        <p id="statDone" class="text-2xl font-extrabold text-emerald-300 mt-0.5">0</p>
      </div>
    </section>

    <!-- Filtros -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <input type="text" id="searchInput" oninput="renderCourses()" placeholder="Buscar por curso, plataforma, área ou tag..." class="flex-1 min-w-[220px] bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500">

      <div class="flex flex-wrap items-center gap-2">
        <select id="statusFilter" onchange="renderCourses()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          <option value="all">Todos os status</option>
          <option value="Pendente">Pendente</option>
          <option value="Em andamento">Em andamento</option>
          <option value="Concluído">Concluído</option>
        </select>
        <span id="syncStatus" class="text-xs text-slate-400 px-2">Pronto</span>
      </div>
    </section>

    <!-- Lista -->
    <section id="coursesContainer" class="space-y-3"></section>
  </main>

  <!-- Modal Cadastro / Edição -->
  <div id="courseModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-40">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h2 id="modalTitle" class="text-sm font-bold text-white">➕ Adicionar Curso ou Certificação</h2>
        <button onclick="closeCourseModal()" class="text-slate-400 hover:text-white text-sm px-2 py-1 rounded-lg bg-slate-800 cursor-pointer">✕</button>
      </div>

      <form id="courseForm" onsubmit="saveCourse(event)" class="space-y-4 text-xs">
        <input type="hidden" id="courseId">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Nome do curso / certificação *</label>
            <input type="text" id="courseName" required placeholder="Ex: PSPO I / ECBA / APIs & Mensageria" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Plataforma / Instituição</label>
            <input type="text" id="coursePlatform" placeholder="Ex: Scrum.org, Udemy, Coursera, Alura" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Status</label>
            <select id="courseStatus" onchange="onStatusChange()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
              <option value="Pendente">Pendente</option>
              <option value="Em andamento">Em andamento</option>
              <option value="Concluído">Concluído</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Progresso (<span id="progressValueLabel">0</span>%)</label>
            <input type="range" id="courseProgress" min="0" max="100" step="5" value="0" oninput="onProgressChange()" class="w-full accent-emerald-500 mt-2">
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Carga horária (h)</label>
            <input type="number" id="courseHours" min="0" step="0.5" placeholder="Ex: 20" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Link do curso / certificação</label>
            <input type="url" id="courseUrl" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
          </div>
          <div>
            <label class="block text-slate-300 font-semibold mb-1">Data alvo / conclusão</label>
            <input type="date" id="courseTargetDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white">
          </div>
        </div>

        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3.5 space-y-3">
          <p class="font-bold text-slate-200">🔐 Dados de acesso da plataforma</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-slate-400 font-semibold mb-1">Login / E-mail</label>
              <input type="text" id="courseLogin" placeholder="seu@email.com ou usuário" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white">
            </div>
            <div>
              <label class="block text-slate-400 font-semibold mb-1">Senha</label>
              <input type="text" id="coursePassword" placeholder="Senha da plataforma" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white">
            </div>
          </div>
        </div>

        <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3.5 space-y-3">
          <p class="font-bold text-slate-200">🏅 Certificado</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
            <div>
              <label class="block text-slate-400 font-semibold mb-1">Link / URL do certificado ou credencial</label>
              <input type="url" id="courseCertUrl" placeholder="https://credly.com/... ou link do certificado" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-white">
            </div>
            <div>
              <label class="block text-slate-400 font-semibold mb-1">Anexar arquivo (PDF / imagem)</label>
              <input type="file" id="courseCertFile" accept=".pdf,.png,.jpg,.jpeg,.webp" onchange="handleCertFileSelect(event)" class="w-full text-[11px] text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-emerald-300 file:font-semibold hover:file:bg-slate-700 cursor-pointer">
            </div>
          </div>
          <div id="certFilePreview" class="hidden items-center justify-between bg-slate-900 border border-emerald-500/30 rounded-lg px-3 py-2">
            <span id="certFileNameLabel" class="text-[11px] text-emerald-300 font-semibold truncate pr-2"></span>
            <button type="button" onclick="clearCertFile()" class="text-[11px] text-rose-400 hover:text-rose-300 cursor-pointer">Remover arquivo</button>
          </div>
        </div>

        <div>
          <label class="block text-slate-300 font-semibold mb-1">Observações / tópicos principais</label>
          <textarea id="courseNotes" rows="3" placeholder="Ex: foco em idempotência, métricas de produto, simulação de prova..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-800">
          <button type="button" onclick="closeCourseModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold cursor-pointer">
            Cancelar
          </button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold cursor-pointer">
            💾 Salvar Curso
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border border-emerald-500/40 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50"></div>

  <script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbzpgOsTtgMWsSAE5ypbLwGBHEoTXydMv5zQf5bi_ZiCHEHHsmK2nozOb8HFPZwlLrzxSw/exec";
    const CLOUD_TOKEN = "LIZA_HUB_2026";
    const STORAGE_KEY = "liza_hub_courses_v1";

    let courses = [];
    let editingCertFile = null;
    const revealedPasswords = new Set();

    function safeGet(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v !== null ? v : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSet(key, val) {
      try {
        localStorage.setItem(key, val);
      } catch (e) {}
    }

    function isCloudConfigured() {
      return Boolean(CLOUD_API_URL) && !CLOUD_API_URL.includes("COLE_AQUI");
    }

    async function cloudGet() {
      if (!isCloudConfigured()) return null;
      const res = await fetch(`${CLOUD_API_URL}?token=${encodeURIComponent(CLOUD_TOKEN)}`);
      return await res.json();
    }

    async function cloudPost(payload) {
      if (!isCloudConfigured()) return null;
      try {
        await fetch(CLOUD_API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ ...payload, token: CLOUD_TOKEN })
        });
      } catch (e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      setTimeout(() => toast.classList.add("opacity-0"), 2800);
    }

    function copyText(text, label = "Copiado!") {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(label)).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      showToast(label);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function init() {
      try {
        courses = JSON.parse(safeGet(STORAGE_KEY, "[]"));
        if (!Array.isArray(courses)) courses = [];
      } catch (e) {
        courses = [];
      }

      renderCourses();

      if (isCloudConfigured()) {
        document.getElementById("syncStatus").textContent = "☁️ Sincronizando...";
        try {
          const data = await cloudGet();
          if (data && data.ok && data.config && data.config.coursesList) {
            const cloudCourses = JSON.parse(data.config.coursesList);
            if (Array.isArray(cloudCourses) && cloudCourses.length > 0) {
              courses = cloudCourses;
              safeSet(STORAGE_KEY, JSON.stringify(courses));
              renderCourses();
            }
          }
          document.getElementById("syncStatus").textContent = "☁️ Sincronizado";
        } catch (e) {
          document.getElementById("syncStatus").textContent = "💾 Local";
        }
      } else {
        document.getElementById("syncStatus").textContent = "💾 Local";
      }
    }

    function persistCourses() {
      safeSet(STORAGE_KEY, JSON.stringify(courses));
      cloudPost({
        action: "saveConfig",
        key: "coursesList",
        value: JSON.stringify(courses)
      });
    }

    function onStatusChange() {
      const status = document.getElementById("courseStatus").value;
      const progressInput = document.getElementById("courseProgress");
      if (status === "Concluído" && Number(progressInput.value) < 100) {
        progressInput.value = 100;
      } else if (status === "Pendente" && Number(progressInput.value) > 0) {
        progressInput.value = 0;
      }
      onProgressChange();
    }

    function onProgressChange() {
      const val = Number(document.getElementById("courseProgress").value);
      document.getElementById("progressValueLabel").textContent = val;
      const statusSelect = document.getElementById("courseStatus");
      if (val === 100) {
        statusSelect.value = "Concluído";
      } else if (val > 0 && statusSelect.value === "Pendente") {
        statusSelect.value = "Em andamento";
      }
    }

    function handleCertFileSelect(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (file.size > 2.5 * 1024 * 1024) {
        showToast("Escolha um arquivo de até 2,5 MB para manter leve no navegador.");
        e.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = ev => {
        editingCertFile = {
          name: file.name,
          type: file.type,
          dataUrl: ev.target.result
        };
        renderCertPreview();
      };
      reader.readAsDataURL(file);
    }

    function renderCertPreview() {
      const box = document.getElementById("certFilePreview");
      const label = document.getElementById("certFileNameLabel");
      if (editingCertFile && editingCertFile.name) {
        label.textContent = editingCertFile.name;
        box.classList.remove("hidden");
        box.classList.add("flex");
      } else {
        label.textContent = "";
        box.classList.add("hidden");
        box.classList.remove("flex");
      }
    }

    function clearCertFile() {
      editingCertFile = null;
      document.getElementById("courseCertFile").value = "";
      renderCertPreview();
    }

    function openCourseModal(id = null) {
      document.getElementById("courseForm").reset();
      editingCertFile = null;
      renderCertPreview();

      if (id) {
        const item = courses.find(c => c.id === id);
        if (!item) return;
        document.getElementById("modalTitle").textContent = "✏️ Editar Curso ou Certificação";
        document.getElementById("courseId").value = item.id;
        document.getElementById("courseName").value = item.name || "";
        document.getElementById("coursePlatform").value = item.platform || "";
        document.getElementById("courseStatus").value = item.status || "Pendente";
        document.getElementById("courseProgress").value = item.progress ?? 0;
        document.getElementById("courseHours").value = item.hours || "";
        document.getElementById("courseUrl").value = item.url || "";
        document.getElementById("courseTargetDate").value = item.targetDate || "";
        document.getElementById("courseLogin").value = item.login || "";
        document.getElementById("coursePassword").value = item.password || "";
        document.getElementById("courseCertUrl").value = item.certUrl || "";
        document.getElementById("courseNotes").value = item.notes || "";
        if (item.certFile) {
          editingCertFile = { ...item.certFile };
          renderCertPreview();
        }
      } else {
        document.getElementById("modalTitle").textContent = "➕ Adicionar Curso ou Certificação";
        document.getElementById("courseId").value = "";
        document.getElementById("courseProgress").value = 0;
      }

      onProgressChange();
      const modal = document.getElementById("courseModal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeCourseModal() {
      const modal = document.getElementById("courseModal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function saveCourse(e) {
      e.preventDefault();
      const idVal = document.getElementById("courseId").value;
      const entry = {
        id: idVal || ("crs-" + Date.now()),
        name: document.getElementById("courseName").value.trim(),
        platform: document.getElementById("coursePlatform").value.trim(),
        status: document.getElementById("courseStatus").value,
        progress: Number(document.getElementById("courseProgress").value) || 0,
        hours: document.getElementById("courseHours").value.trim(),
        url: document.getElementById("courseUrl").value.trim(),
        targetDate: document.getElementById("courseTargetDate").value,
        login: document.getElementById("courseLogin").value.trim(),
        password: document.getElementById("coursePassword").value,
        certUrl: document.getElementById("courseCertUrl").value.trim(),
        certFile: editingCertFile ? { ...editingCertFile } : null,
        notes: document.getElementById("courseNotes").value.trim(),
        updatedAt: new Date().toLocaleDateString("pt-BR")
      };

      if (idVal) {
        const idx = courses.findIndex(c => c.id === idVal);
        if (idx >= 0) courses[idx] = entry;
      } else {
        courses.unshift(entry);
      }

      persistCourses();
      renderCourses();
      closeCourseModal();
      showToast("Curso salvo com sucesso!");
    }

    function deleteCourse(id) {
      courses = courses.filter(c => c.id !== id);
      persistCourses();
      renderCourses();
      showToast("Item removido.");
    }

    function togglePasswordVisibility(id) {
      if (revealedPasswords.has(id)) {
        revealedPasswords.delete(id);
      } else {
        revealedPasswords.add(id);
      }
      renderCourses();
    }

    function openStoredCertFile(id) {
      const item = courses.find(c => c.id === id);
      if (!item || !item.certFile || !item.certFile.dataUrl) return;
      const a = document.createElement("a");
      a.href = item.certFile.dataUrl;
      a.download = item.certFile.name || "certificado";
      a.target = "_blank";
      a.click();
    }

    function statusBadgeClass(status) {
      if (status === "Concluído") return "bg-emerald-500/15 text-emerald-300 border-emerald-500/30";
      if (status === "Em andamento") return "bg-sky-500/15 text-sky-300 border-sky-500/30";
      return "bg-amber-500/15 text-amber-300 border-amber-500/30";
    }

    function updateStats() {
      document.getElementById("statTotal").textContent = courses.length;
      document.getElementById("statPending").textContent = courses.filter(c => c.status === "Pendente").length;
      document.getElementById("statProgress").textContent = courses.filter(c => c.status === "Em andamento").length;
      document.getElementById("statDone").textContent = courses.filter(c => c.status === "Concluído").length;
    }

    function renderCourses() {
      updateStats();
      const container = document.getElementById("coursesContainer");
      const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();
      const statusFilter = document.getElementById("statusFilter").value;

      const list = courses.filter(c => {
        if (statusFilter !== "all" && c.status !== statusFilter) return false;
        if (query) {
          const hay = [c.name, c.platform, c.notes, c.status].join(" ").toLowerCase();
          if (!hay.includes(query)) return false;
        }
        return true;
      });

      if (!list.length) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-2">
            <p class="text-sm font-semibold text-slate-300">Nenhum curso encontrado por aqui ainda.</p>
            <p class="text-xs text-slate-500">Clique em "Novo Curso / Certificação" para cadastrar o primeiro.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(item => {
        const showPass = revealedPasswords.has(item.id);
        const passDisplay = item.password ? (showPass ? escapeHtml(item.password) : "••••••••") : "—";
        const formattedDate = item.targetDate ? item.targetDate.split("-").reverse().join("/") : "";

        return `
          <div class="bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl p-4 space-y-3 transition">
            <div class="flex flex-wrap items-start justify-between gap-3">
              <div class="space-y-1 flex-1 min-w-[240px]">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full border ${statusBadgeClass(item.status)}">
                    ${escapeHtml(item.status)} • ${item.progress}%
                  </span>
                  ${item.platform ? `<span class="text-[11px] font-semibold text-slate-300">${escapeHtml(item.platform)}</span>` : ""}
                  ${item.hours ? `<span class="text-[11px] text-slate-400">• ${escapeHtml(item.hours)}h</span>` : ""}
                  ${formattedDate ? `<span class="text-[11px] text-slate-400">• Data: ${escapeHtml(formattedDate)}</span>` : ""}
                </div>
                <h3 class="text-sm font-bold text-white">${escapeHtml(item.name)}</h3>
                ${item.notes ? `<p class="text-xs text-slate-400 leading-relaxed">${escapeHtml(item.notes)}</p>` : ""}
              </div>

              <div class="flex flex-wrap items-center gap-2 shrink-0">
                ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer" class="text-xs font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-3 py-1.5 rounded-lg transition">Acessar Curso ↗</a>` : ""}
                ${item.certUrl ? `<a href="${escapeHtml(item.certUrl)}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold bg-sky-500/15 hover:bg-sky-500/25 text-sky-300 border border-sky-500/30 px-3 py-1.5 rounded-lg transition">🏅 Certificado ↗</a>` : ""}
                ${item.certFile ? `<button onclick="openStoredCertFile('${item.id}')" class="text-xs font-semibold bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 px-3 py-1.5 rounded-lg cursor-pointer">📎 ${escapeHtml(item.certFile.name)}</button>` : ""}
                <button onclick="openCourseModal('${item.id}')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-2.5 py-1.5 rounded-lg cursor-pointer">Editar</button>
                <button onclick="deleteCourse('${item.id}')" class="text-xs text-slate-500 hover:text-rose-400 px-2 py-1.5 cursor-pointer">✕</button>
              </div>
            </div>

            <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
              <div class="bg-emerald-500 h-full rounded-full transition-all duration-300" style="width: ${item.progress}%"></div>
            </div>

            ${(item.login || item.password) ? `
              <div class="bg-slate-950/80 border border-slate-800/90 rounded-xl px-3.5 py-2.5 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div class="flex flex-wrap items-center gap-4">
                  ${item.login ? `<div><span class="text-slate-500">Login:</span> <span class="text-slate-200 font-medium">${escapeHtml(item.login)}</span></div>` : ""}
                  ${item.password ? `<div><span class="text-slate-500">Senha:</span> <span class="text-slate-200 font-mono">${passDisplay}</span></div>` : ""}
                </div>
                <div class="flex items-center gap-2">
                  ${item.login ? `<button onclick="copyText(${JSON.stringify(item.login)}, 'Login copiado!')" class="text-[11px] text-sky-400 hover:text-sky-300 font-semibold cursor-pointer">Copiar login</button>` : ""}
                  ${item.password ? `
                    <button onclick="togglePasswordVisibility('${item.id}')" class="text-[11px] text-slate-400 hover:text-white cursor-pointer">${showPass ? "Ocultar" : "Ver senha"}</button>
                    <button onclick="copyText(${JSON.stringify(item.password)}, 'Senha copiada!')" class="text-[11px] text-emerald-400 hover:text-emerald-300 font-semibold cursor-pointer">Copiar senha</button>
                  ` : ""}
                </div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    init();
  </script>
</body>
</html>
